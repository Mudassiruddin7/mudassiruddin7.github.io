<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">CryptoFair-FL: verifiable fairness in federated learning</title><desc id="d">Each institution computes group-conditional prediction counts locally and sends only Paillier ciphertexts. A secure aggregator adds them homomorphically with a batched O(n log n) protocol, and a fairness verifier checks demographic parity and equalized odds under (0.5, 1e-6) differential privacy, feeding the result back into training.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#2a78d6"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4a3aa7"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker></defs><rect width="960" height="640" fill="#ffffff"/><text x="24" y="46" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="start">CryptoFair-FL<tspan font-size="23" font-weight="400" fill="#52514e">  ·  verify fairness without seeing anyone’s data</tspan></text>
