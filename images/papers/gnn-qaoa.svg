<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">Hybrid GNN-QAOA pipeline for drug repurposing portfolio selection</title><desc id="d">A graph neural network encodes the protein-drug interaction graph and molecular features into candidate scores; portfolio selection under therapeutic constraints is mapped to a QUBO and solved by QAOA, compiled to IBM 127-qubit heavy-hex topology with SWAP-aware routing to keep circuit depth low.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4a3aa7"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4a3aa7"/></marker></defs><rect width="960" height="640" fill="#ffffff"/><text x="24" y="46" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="start">GNN → QAOA<tspan font-size="23" font-weight="400" fill="#52514e">  ·  constrained drug repurposing on quantum hardware</tspan></text>
