<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">AgentCompress: task-aware compression for LLM agents</title><desc id="d">A controller reads the first 32 tokens of each agent task, predicts its cognitive load, and picks a quantization, attention-pruning and sparsity policy, serving the task from a cache of FP16, INT8, INT4 and INT2 model variants. Compute drops 68.3% while task success stays at 96.2%, with about 12 ms of routing overhead.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#898781"/></marker></defs><rect width="960" height="640" fill="#ffffff"/><text x="24" y="46" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="start">AgentCompress<tspan font-size="23" font-weight="400" fill="#52514e">  ·  full precision only where the task needs it</tspan></text>
