<svg xmlns="http://www.w3.org/2000/svg" width="960" height="745" viewBox="0 0 960 745" role="img" aria-labelledby="t d"><title id="t">BKF: layer order and key binding in hybrid language models</title><desc id="d">BKF puts the global layer first in each block and binds every key to the three tokens before it with a causal width-4 convolution, so one attention step links a question to its value. All 11 BKF runs learned key-value retrieval by step 300, against 13 of 20 global-last hybrids learning at steps 1,100 to 3,600, and BKF kept 98.0% recall at 64 times the training length against 91% to 92% for global-last hybrids given the same length scale.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c3c2b7"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#2a78d6"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#eb6834"/></marker></defs><rect width="960" height="745" fill="#ffffff"/><text x="24" y="46" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="start">BKF<tspan font-size="23" font-weight="400" fill="#52514e">  ·  layer order and key binding decide when a hybrid learns to retrieve</tspan></text>
<text x="24" y="78" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Fifteen designs, 49 models, one training budget; retrieval tested to 64× the training length.</text>
