<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">PMP-DACIS: disease-aware pruning for few-shot plant pathology</title><desc id="d">A pre-trained ResNet-18 (11.2M parameters) is pruned 40% using Disease-Aware Channel Importance Scores, meta-trained on few-shot tasks, then pruned again with scores re-weighted by meta-gradients, reaching 2.5M parameters that run at 7 FPS on a Raspberry Pi 4 while keeping 92.3% of full accuracy.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#2a78d6"/></marker></defs><rect width="960" height="640" fill="#ffffff"/><text x="24" y="48" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="800" fill="#0b0b0b" text-anchor="start">PMP-DACIS<tspan font-size="23" font-weight="400" fill="#52514e">  ·  disease-aware pruning meets few-shot meta-learning</tspan></text>
